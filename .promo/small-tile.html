<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 440px; height: 280px; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    padding: 24px 28px;
    position: relative;
  }
  .logo {
    width: 40px;
    height: 40px;
    background: rgba(255,255,255,0.18);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 14px;
    letter-spacing: -1px;
  }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    line-height: 1.2;
  }
  p {
    font-size: 13px;
    opacity: 0.9;
    line-height: 1.45;
    max-width: 270px;
  }
  .demo {
    position: absolute;
    right: 18px;
    bottom: 18px;
    background: rgba(255,255,255,0.95);
    border-radius: 10px;
    padding: 10px 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    transform: rotate(-3deg);
    max-width: 180px;
  }
  .demo .input {
    color: #6366f1;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .demo .from {
    color: #1a1a2e;
    font-size: 13px;
    margin-bottom: 8px;
    font-family: "SF Mono", monospace;
  }
  .demo .arrow {
    color: #6366f1;
    font-size: 14px;
    margin-bottom: 4px;
  }
  .demo .to {
    color: #1a1a2e;
    font-size: 14px;
    font-weight: 600;
  }
  .kbd-row {
    position: absolute;
    bottom: 22px;
    left: 28px;
    display: flex;
    gap: 4px;
    align-items: center;
    font-size: 12px;
    color: rgba(255,255,255,0.85);
  }
  kbd {
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    padding: 2px 6px;
    font-family: "SF Mono", monospace;
    font-size: 11px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="logo">αβ</div>
  <h1>Greeklish to Greek</h1>
  <p>Type Greeklish, get proper Greek instantly. Powered by Claude AI.</p>
  <div class="kbd-row">
    <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>G</kbd>
  </div>
  <div class="demo">
    <div class="input">Greeklish → Greek</div>
    <div class="from">Kalimera!</div>
    <div class="to">Καλημέρα!</div>
  </div>
</body>
</html>
